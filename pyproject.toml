[project]
name = "crs-calculator"
version = "0.1.0"
description = "Unofficial, explainable Express Entry CRS calculator with simulations (Shiny for Python)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "shiny>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
crs-calculator = "crs_calculator.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crs_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
packages = ["crs_calculator"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
